<section class="categories-page">
  <div class="container">
    <div class="page-head">
      <span class="eyebrow">{{ 'nav.categories' | translate }}</span>
      <h1>{{ 'categories.title' | translate }}</h1>
      <p>{{ 'categories.subtitle' | translate }}</p>
    </div>

    <div class="category-grid">
      @for (c of categories(); track c; let i = $index) {
        <button
          class="category-card"
          [class.is-featured]="i === 0"
          type="button"
          (click)="goToProducts(c)"
        >
          <span class="category-media">
            <img [src]="'/categories/' + meta(c).icon + '.jpg'" [alt]="label(c)" loading="lazy" />
          </span>
          <span class="category-meta">
            <span class="category-index">{{ (i + 1).toString().padStart(2, '0') }}</span>
            <span class="category-name">{{ label(c) }}</span>
            <span class="category-cta">
              {{ 'categories.viewProducts' | translate }}
              <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
          </span>
        </button>
      }
    </div>
  </div>
</section>
